# LIFECYCLE/NAMESPACE: Scoped node name for /our_bot namespace
our_bot/behavior_server:
  ros__parameters:
    # TIME: Synchronizes recovery behaviors with simulation clock
    use_sim_time: True
    enable_stamped_cmd_vel: true
    # CONNECTION: Directs recovery behaviors to local costmap topics
    costmap_topic: local_costmap/costmap_raw
    footprint_topic: local_costmap/published_footprint
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "backup", "wait"]
    spin:
      plugin: "nav2_behaviors::Spin"
    backup:
      plugin: "nav2_behaviors::BackUp"
    wait:
      plugin: "nav2_behaviors::Wait"
    local_frame: our_bot/odom
    global_frame: map
    robot_base_frame: our_bot/base_link
    # TIME/TF FIX: Increased transform timeout to 1.0s to prevent spin/backup drops on sim clock jitter
    transform_timeout: 0.2
    simulate_ahead_time: 2.0
    max_rotational_vel: 1.0
    min_rotational_vel: 0.1
    rotational_acc_lim: 3.2